<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Produto - Descubre Venezuela</title>
    <meta name="description" content="Formulário de avaliação de produtos para o projeto final.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos/venezuela.css">
    <script src="scripts/avaliacao.js" defer></script>

    <style>
        .star-rating {
            display: flex !important;
            flex-direction: row-reverse !important; 
            justify-content: flex-end !important;
            font-size: 2.8rem !important;
            gap: 0.5rem !important;
            margin: 0.5rem 0 1.5rem 0 !important;
            width: max-content !important;
        }

        .star-rating input,
        .star-rating input[type="radio"] {
            position: absolute !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            appearance: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .star-rating label {
            color: #cbd5e1 !important; 
            cursor: pointer !important;
            display: inline-block !important;
            transition: color 0.2s ease, transform 0.1s ease !important;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #F4B41A !important; 
            transform: scale(1.1);
        }

        .star-rating input[type="radio"]:checked ~ label,
        .star-rating input[type="radio"]:checked ~ label ~ label {
            color: #F4B41A !important;
        }
    </style>
</head>
<body>

    <header>
        <span id="site-title">Avaliação de Serviços 🇻🇪</span>
        <button id="menu-button" aria-label="Alternar menu">☰</button>
        <nav>
            <ul id="menu-links">
                <li><a href="planejamentodosite.html">Página Inicial</a></li>
                <li><a href="galeria.html">Galeria Interativa</a></li>
                <li><a href="contato.html">Contato e Cadastro</a></li>
                <li><a href="formulario.html" class="active">Avaliar Produto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="main-title">Avalie sua Experiência</h1>
        <p class="intro-text">Sua opinião é fundamental para melhorarmos nossos guias e serviços de turismo.</p>

        <section class="form-card">
            <form method="get" action="avaliacao.html" id="review-form">
                
                <div class="form-group">
                    <label for="produto">Nome do Produto/Serviço: <span class="required">*</span></label>
                    <select id="produto" name="produto" required>
                        <option value="" disabled selected>Selecione um Produto...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Classificação Geral: <span class="required">*</span></label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="classificacao" value="5" required><label for="star5" title="5 estrelas">☆</label>
                        <input type="radio" id="star4" name="classificacao" value="4" required><label for="star4" title="4 estrelas">☆</label>
                        <input type="radio" id="star3" name="classificacao" value="3" required><label for="star3" title="3 estrelas">☆</label>
                        <input type="radio" id="star2" name="classificacao" value="2" required><label for="star2" title="2 estrelas">☆</label>
                        <input type="radio" id="star1" name="classificacao" value="1" required><label for="star1" title="1 estrela">☆</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="data-instalacao">Data de Utilização/Instalação: <span class="required">*</span></label>
                    <input type="date" id="data-instalacao" name="dataInstalacao" required>
                </div>

                <div class="form-group">
                    <label>Recursos que achou úteis (marque os aplicáveis):</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="recursos" value="guias"> Guias Digitais Completos</label>
                        <label><input type="checkbox" name="recursos" value="mapas"> Mapas Offline de Rotas</label>
                        <label><input type="checkbox" name="recursos" value="suporte"> Suporte ao Viajante 24h</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="avaliacao-texto">Avaliação Escrita (Opcional):</label>
                    <textarea id="avaliacao-texto" name="avaliacaoTexto" rows="4" placeholder="Conte-nos detalhes da sua experiência..."></textarea>
                </div>

                <div class="form-group">
                    <label for="nome-usuario">Seu Nome (Opcional):</label>
                    <input type="text" id="nome-usuario" name="nomeUsuario" placeholder="Ex: Maria Silva">
                </div>

                <input type="submit" value="Enviar Avaliação" class="btn-enviar">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="anoatual"></span> 🌺 Karen Zerpa 🌺 Campinas, SP</p>
        <p id="ultimaModificacao" class="highlight-date"></p>
        <p><a href="referencias.html" style="color: var(--card-bg); text-decoration: underline;">Referências e Citações</a></p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const botaoMenu = document.getElementById("menu-button");
            const listaLinks = document.getElementById("menu-links");

            if (botaoMenu && listaLinks) {
                botaoMenu.addEventListener("click", () => {
                    listaLinks.classList.toggle("open");
                    
                    botaoMenu.textContent = listaLinks.classList.contains("open") ? "❌" : "☰";
                });
            }

            const listaProdutos = [
                { id: "fc-1020", name: "Guia Turístico Completamente Seguro - Canaima" },
                { id: "qn-4101", name: "Tour Gastronômico - Rota da Arepa" },
                { id: "ch-1978", name: "Passaporte Cultural - Festividades de Yare" },
                { id: "st-1893", name: "E-Book de Trilhas e Mapas - Los Roques" }
            ];

            const selectElemento = document.getElementById("produto");
            
            if (selectElemento) {
                selectElemento.innerHTML = '<option value="" disabled selected>Selecione um Produto...</option>';

                listaProdutos.forEach(prod => {
                    const opcao = document.createElement("option");
                    opcao.value = prod.id;         
                    opcao.textContent = prod.name; 
                    selectElemento.appendChild(opcao);
                });
                
                console.log("Produtos injetados com sucesso!");
            }

            const elementoAno = document.getElementById("anoatual");
            if (elementoAno) elementoAno.textContent = new Date().getFullYear();

            const elementoModificacao = document.getElementById("ultimaModificacao");
            if (elementoModificacao) {
                elementoModificacao.innerHTML = `Última modificação: <span class="highlight-date">${document.lastModified}</span>`;
            }
        });
    </script>
</body>
</html>
