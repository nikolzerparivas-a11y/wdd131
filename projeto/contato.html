<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Contato - Descubre Venezuela</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estilos/venezuela.css">
    <script src="scripts/venezuela.js" defer></script>
</head>
<body>

    <header>
        <span id="site-title">Descubre Venezuela 🇻🇪</span>
        <button id="menu-button" aria-label="Alternar menu">☰</button>
        <nav>
            <ul id="menu-links">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="galeria.html">Galeria Interativa</a></li>
                <li><a href="contato.html" class="active">Contato e Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="main-title">Planeje sua Visita</h1>
        
        <div id="boas-vindas-container"></div>

        <section class="form-card">
            <form id="cadastro-form">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email" required placeholder="seu@email.com">

                <label for="interesse">Área de Maior Interesse:</label>
                <select id="interesse" required>
                    <option value="" disabled selected>Escolha uma opção</option>
                    <option value="Praias e Natureza">Praias e Natureza</option>
                    <option value="Cultura e Festas">Cultura e Festas</option>
                    <option value="Gastronomia">Gastronomia (Arepas, Patacones)</option>
                </select>

                <button type="submit" class="btn-enviar">Salvar Preferências</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="anoatual"></span> 🌺 Karen Zerpa 🌺 Campinas, SP</p>
        <p id="ultimaModificacao" class="highlight-date"></p>
        <p><a href="referencias.html" style="color: var(--card-bg); text-decoration: underline;">Referências e Citações</a></p>
    </footer>

</body>
</html>
